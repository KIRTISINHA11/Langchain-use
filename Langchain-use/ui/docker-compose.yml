version: '3.8'

services:
  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: zsearch-backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app/backend
      - ./Langchain-use:/app/Langchain-use
      - ./Langchain-use/data:/app/data
    command: python backend/main.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zsearch-network

  # React Frontend
  frontend:
    build:
      context: ./React-App
      dockerfile: Dockerfile
    container_name: zsearch-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - zsearch-network
    stdin_open: true
    tty: true

networks:
  zsearch-network:
    driver: bridge

volumes:
  chroma_data:
    driver: local
